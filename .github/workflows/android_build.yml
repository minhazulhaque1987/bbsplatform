name: Build Android APK
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Assets Generator
        run: npm install @capacitor/assets

      - name: Prepare Web Assets & Generate Icons
        run: |
          mkdir -p www
          cp -r * www || true
          # আপনার assets ফোল্ডারে icon.png ফাইলটি থাকতে হবে
          npx capacitor-assets generate --android

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BBS Platform" "com.minhaj.bbsplatform" --web-dir www || true
          rm -rf android
          npx cap add android

      - name: Sync and Update
        run: |
          npx cap copy
          npx cap update

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
