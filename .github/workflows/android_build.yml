name: Build Android APK
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        run: |
          mkdir -p dist
          cp index.html dist/ || true
          # আপনার assets ফোল্ডারে icon.png থাকলে তা কপি হবে
          if [ -d "assets" ]; then cp -r assets dist/; fi

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "BBS Platform" "com.minhaz.bbsplatform" --web-dir dist || true

      - name: Generate Icons
        run: |
          # যদি assets/icon.png থাকে তবেই এটি রান করবে
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Icon not found in assets/icon.png. Skipping icon generation."
          fi

      - name: Build Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap copy
          npx cap update

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # গ্র্যাডলকে জাভা হোম চিনিয়ে দেওয়া
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
