# ... আগের স্টেপগুলো (Checkout, Setup Java/Node) ...

      - name: Prepare Assets
        run: |
          mkdir -p www
          cp -r * www || true
          
          # আইকন জেনারেটর রান করা
          npm install @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync and Build
        run: |
          npx cap copy
          npx cap update
          cd android && ./gradlew assembleDebug
