name: Build Android APK
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/ || true
          if [ -d "css" ]; then cp -r css www/; fi
          if [ -d "js" ]; then cp -r js www/; fi
          if [ -d "resources" ]; then cp -r resources www/; fi
          if [ -d "config" ]; then cp -r config www/; fi
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: Install Dependencies
        run: |
          npm install
          # Ensure Capacitor CLI and Assets tool are available
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets

      - name: Generate Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Icon not found in assets/icon.png. Skipping icon generation."
          fi

      - name: Sync Android Project
        run: |
          # Use sync to copy web assets and update native dependencies
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Ensure correct Java version is used
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBS-Platform-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
