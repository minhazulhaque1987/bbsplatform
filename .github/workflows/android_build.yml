name: Build Android APK
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        run: |
          # সাইজ কমানোর চিন্তা বাদ দিয়ে আপাতত সব ফাইল কপি করা হচ্ছে যাতে ডিজাইন না ভাঙে
          mkdir -p www
          cp -r * www || true
          # অপ্রয়োজনীয় ফোল্ডার ডিলিট করা হচ্ছে যেন সাইজ একটু কমে
          rm -rf www/android www/node_modules www/.github

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          # এবার 'www' ফোল্ডার ব্যবহার করা হচ্ছে
          npx cap init "BBS Platform" "com.minhaj.bbsplatform" --web-dir www || true

      - name: Generate Icons
        run: |
          if [ -d "assets" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Build Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap copy
          npx cap update

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
