name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4 # v4 আপডেট করা হয়েছে

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4 আপডেট করা হয়েছে
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true # যদি অলরেডি থাকে তাই এরর এড়াতে true

      - name: Sync Web Assets
        run: npx cap copy

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # এখানে v4 ব্যবহার করা হয়েছে
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
