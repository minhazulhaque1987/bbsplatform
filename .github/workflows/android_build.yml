name: Build Android APK
on: [push]

env:
  # গিটহাব অ্যাকশনসকে আধুনিক Node.js 24 ব্যবহার করতে বাধ্য করবে (ওয়ার্নিং দূর হবে)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets (Size Optimization)
        run: |
          # শুধু প্রয়োজনীয় ফাইলগুলো আলাদা করা হচ্ছে যাতে অ্যাপের সাইজ ছোট থাকে
          mkdir -p dist
          cp index.html dist/ || true
          # আপনার যদি assets ফোল্ডারে icon.png থাকে তা কপি হবে
          if [ -d "assets" ]; then cp -r assets dist/; fi
          # আপনার সিএসএস বা জেএস ফাইলগুলো থাকলে নিচের লাইনগুলো আনকমেন্ট করতে পারেন
          # cp -r css dist/ || true
          # cp -r js dist/ || true

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "BBS Platform" "com.minhaj.bbsplatform" --web-dir dist || true

      - name: Generate Icons
        run: |
          # যদি assets/icon.png ফাইলটি থাকে তবেই এটি রান করবে
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Icon not found. Using default icon."
          fi

      - name: Build Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap copy
          npx cap update

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # নিশ্চিত করা হচ্ছে যেন Java 21 ব্যবহার হয়
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
