- name: Prepare Web Assets & Generate Icons
        run: |
          # শুধু প্রয়োজনীয় ফাইলগুলো কপি করা (অপ্রয়োজনীয় ফাইল বাদ দিয়ে)
          mkdir -p dist
          cp index.html dist/ || true
          cp -r assets dist/ || true
          # এখানে আপনার অন্য প্রয়োজনীয় ফোল্ডার বা ফাইল (যেমন CSS/JS) যোগ করুন
          
      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # web-dir এখন 'dist' ফোল্ডারকে নির্দেশ করবে যা শুধু আপনার কোড ধারণ করে
          npx cap init "BBS Platform" "com.minhaj.bbsplatform" --web-dir dist || true
          rm -rf android
          npx cap add android

      - name: Generate Icons
        run: |
          npm install @capacitor/assets
          # শুধু অ্যান্ড্রয়েডের জন্য আইকন তৈরি
          npx capacitor-assets generate --android
